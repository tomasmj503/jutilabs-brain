# Stack JUTILABS en Contabo. Un solo servidor, un solo compose.
# Primer arranque: ver infra/README.md (pasos obligatorios antes de `up -d`).
name: jutilabs

x-logging: &logs
  driver: json-file
  options:
    max-size: "50m"
    max-file: "5"

services:
  caddy:
    logging: *logs
    # Versiones fijas por huella (V-31 / PC-26): la que corría el 15-oct-2026. Para actualizar: cambiar a propósito y probar.
    image: caddy:2@sha256:0c994536bddb66445885237f1a5dcc1916bccea922661c76b4e9fc24061f9b52
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - chatwoot-rails
      - n8n
      - brain

  postgres:
    logging: *logs
    # Chatwoot exige pgvector. n8n comparte la instancia con base propia (ver init-db.sh).
    image: pgvector/pgvector:pg16@sha256:ccc6e83d6e35e931dc7c5def2022729d5a6c370318d099181995567ff1fb4d6b
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: postgres
      N8N_DB_PASSWORD: ${N8N_DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db.sh:/docker-entrypoint-initdb.d/init-db.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    logging: *logs
    image: redis:7-alpine@sha256:858f009f9709ce576febc734aa78b8f6d624b82571f9ddb6bda4377c833b3499
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a ${REDIS_PASSWORD} ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 10

  # Redis PROPIO del cerebro (ADR-17 / V-31): candados, buffer y dedup. Antes compartía instancia con Chatwoot
  # (un FLUSHDB o una cola de Sidekiq atascada lo tumbaba) y no tenía límite de memoria.
  #  - maxmemory 256mb: el cerebro guarda claves pequeñas con vencimiento; ajustar con `INFO memory` (S-13).
  #  - noeviction: si se llena, las escrituras FALLAN en vez de expulsar candados. La bandeja durable (mensajes.atendido_at)
  #    cubre esa falla: ningún mensaje se pierde sin aviso.
  redis-brain:
    logging: *logs
    image: redis:7-alpine@sha256:858f009f9709ce576febc734aa78b8f6d624b82571f9ddb6bda4377c833b3499
    restart: unless-stopped
    command:
      - redis-server
      - --requirepass
      - ${BRAIN_REDIS_PASSWORD}
      - --appendonly
      - "yes"
      - --maxmemory
      - 256mb
      - --maxmemory-policy
      - noeviction
    volumes:
      - redis_brain_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a $$REDIS_PW ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
    environment:
      REDIS_PW: ${BRAIN_REDIS_PASSWORD}

  chatwoot-rails:
    logging: *logs
    image: chatwoot/chatwoot:${CHATWOOT_VERSION}
    restart: unless-stopped
    env_file: .env.chatwoot
    command: ["bundle", "exec", "rails", "s", "-p", "3000", "-b", "0.0.0.0"]
    volumes:
      - chatwoot_storage:/app/storage
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  chatwoot-sidekiq:
    logging: *logs
    image: chatwoot/chatwoot:${CHATWOOT_VERSION}
    restart: unless-stopped
    env_file: .env.chatwoot
    command: ["bundle", "exec", "sidekiq", "-C", "config/sidekiq.yml"]
    volumes:
      - chatwoot_storage:/app/storage
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  n8n:
    logging: *logs
    image: n8nio/n8n:${N8N_VERSION}
    restart: unless-stopped
    # El editor ya no se publica en internet (PC-26). Se entra por túnel SSH desde la Mac:
    #   ssh -L 5678:127.0.0.1:5678 jutilabs@<IP>  → http://localhost:5678
    # Solo escucha en 127.0.0.1 del servidor: no es accesible desde afuera (ufw no interviene).
    ports:
      - "127.0.0.1:5678:5678"
    environment:
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_PORT: 5432
      DB_POSTGRESDB_DATABASE: n8n
      DB_POSTGRESDB_USER: n8n
      DB_POSTGRESDB_PASSWORD: ${N8N_DB_PASSWORD}
      N8N_HOST: n8n.jutilabs.com
      N8N_PROTOCOL: https
      N8N_PORT: 5678
      N8N_PROXY_HOPS: 1
      WEBHOOK_URL: https://n8n.jutilabs.com/
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY}
      GENERIC_TIMEZONE: America/Bogota
      TZ: America/Bogota
      N8N_DIAGNOSTICS_ENABLED: "false"
      EXECUTIONS_DATA_PRUNE: "true"
      EXECUTIONS_DATA_MAX_AGE: 168
    volumes:
      - n8n_data:/home/node/.n8n
    depends_on:
      postgres:
        condition: service_healthy

  brain:
    logging: *logs
    build:
      context: ..
      dockerfile: Dockerfile
    # Etiqueta por commit (V-30): BRAIN_TAG=<sha7> en infra/.env. Para volver atrás se pone la etiqueta anterior y
    # `docker compose up -d brain` (ver infra/README.md, «Desplegar y volver atrás»).
    image: jutilabs/brain:${BRAIN_TAG:-local}
    restart: unless-stopped
    # Cierre ordenado: al apagar, el cerebro espera hasta TOPE_APAGADO_MS (src/apagado.ts, 120 s) a que
    # terminen los turnos en curso. Este tiempo debe ser MAYOR; si no, Docker lo corta antes (SIGKILL).
    stop_grace_period: 130s
    env_file: ../.env
    environment:
      NODE_ENV: production
      PORT: 8080
      # Redis propio del cerebro (no el de Chatwoot).
      REDIS_URL: redis://:${BRAIN_REDIS_PASSWORD}@redis-brain:6379
    depends_on:
      redis-brain:
        condition: service_healthy

volumes:
  caddy_data:
  caddy_config:
  postgres_data:
  redis_data:
  redis_brain_data:
  chatwoot_storage:
  n8n_data:
